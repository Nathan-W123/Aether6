<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aether-6 Plate 1</title>
    <style>
      @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: block;
        src: url('fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: block;
        src: url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Sans Condensed'; font-weight: 500; font-display: block;
        src: url('fonts/ibm-plex-sans-condensed-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Sans Condensed'; font-weight: 600; font-display: block;
        src: url('fonts/ibm-plex-sans-condensed-latin-600-normal.woff2') format('woff2'); }
      html, body { margin: 0; background: #14171a; overflow: hidden; }
      #stage { position: relative; width: 1080px; height: 1080px; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view" width="1080" height="1080"></canvas></div>
    <script src="flight.js"></script>
    <script type="module">
      // The fonts must be resident before the sheet texture is drawn, or the printed
      // annotation falls back to a system face for the whole film.
      await document.fonts.load('600 26px "IBM Plex Sans Condensed"')
      await document.fonts.load('500 17px "IBM Plex Mono"')
      await document.fonts.load('400 14px "IBM Plex Mono"')
      await document.fonts.ready

      const { render } = await import('./stage.js')
      window.FILM = { total: 22 }
      window.renderFrame = (t) => {
        const f = render(t, window.FILM.total)
        return { t: f.t, gs: f.gs, xtrack: f.xtrack, wp: f.wp }
      }
      window.READY = true
    </script>
  </body>
</html>
